<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberia</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="top">
      <img class="logo" src="/icon.svg" alt="" width="36" height="36" />
      <div class="brand">
        <h1>Cyberia</h1>
        <p id="pc-name" class="muted"></p>
      </div>
      <span id="phone-pill" class="pill">…</span>
    </header>

    <main>
      <div id="server-error" class="banner danger" hidden></div>

      <section class="card" aria-labelledby="phone-title">
        <h2 id="phone-title">Celular</h2>
        <div id="phone-body"></div>
      </section>

      <section class="card" aria-labelledby="folder-title">
        <h2 id="folder-title">Carpeta de audios</h2>
        <div id="folder-body"></div>
      </section>

      <section class="card sync" aria-labelledby="sync-title">
        <h2 id="sync-title" class="sr-only">Sincronizar</h2>
        <button id="sync-btn" class="primary big" type="button">Sincronizar</button>
        <p id="sync-status" class="muted center"></p>
        <div id="report"></div>
      </section>

      <section class="card" aria-labelledby="library-title">
        <div class="row between">
          <h2 id="library-title">Biblioteca</h2>
          <button id="refresh-btn" class="ghost small" type="button" title="Volver a leer la carpeta">Actualizar</button>
        </div>
        <p id="library-summary" class="muted"></p>
        <div id="library"></div>
      </section>
    </main>

    <footer class="legal muted">
      Cyberia es software libre bajo la licencia GPL 3.0 o posterior y se ofrece sin ninguna garantía.
    </footer>

    <dialog id="pair-dialog" aria-labelledby="pair-title">
      <h2 id="pair-title">Vincular celular</h2>
      <div id="pair-body"></div>
      <div class="row end">
        <button id="pair-close" class="ghost" type="button">Cancelar</button>
      </div>
    </dialog>
  </body>
</html>
