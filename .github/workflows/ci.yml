name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    name: PC (Rust) y núcleo Kotlin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri en Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Interfaz de la PC
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Pruebas Rust
        run: cargo test --workspace --locked

      - name: Servidor sin interfaz
        run: cargo build -p cyberia-server --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Núcleo Kotlin (incluye la prueba contra el servidor Rust)
        working-directory: android
        run: ./gradlew -p core test --no-daemon

  android:
    name: App Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El runner ya trae el SDK de Android; Gradle baja la plataforma que falte.
      - uses: gradle/actions/setup-gradle@v4

      # Cada corrida es una versión más nueva (versionCode = número de corrida), firmada siempre
      # con la misma clave: así el celular se actualiza encima sin perder nada.
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CYBERIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cyberia.jks"
            echo "CYBERIA_KEYSTORE_FILE=$RUNNER_TEMP/cyberia.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto CYBERIA_KEYSTORE_BASE64. Este APK se firma con una clave temporal: sirve para probar, pero no se puede instalar encima de otra versión. Corré una vez el workflow «Crear clave de firma»."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          CYBERIA_KEYSTORE_PASSWORD: ${{ secrets.CYBERIA_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk ../dist-android/cyberia.apk
          cp app/build/outputs/apk/release/output-metadata.json ../dist-android/cyberia-apk.json
          cat ../dist-android/cyberia-apk.json
          ls -la ../dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: cyberia-android
          path: dist-android/
          if-no-files-found: error

  windows:
    name: Instalador de Windows
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # El instalador trae la app del celular de la misma versión: el celular se actualiza
      # desde la PC por el Wi-Fi.
      - uses: actions/download-artifact@v4
        with:
          name: cyberia-android
          path: desktop/src-tauri/resources

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalador NSIS
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          echo "{\"version\":\"0.1.${{ github.run_number }}\"}" > version.json
          npx tauri build --bundles nsis --config version.json
          ls -la ../target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: cyberia-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-e2e:
    name: Android en emulador (vincular, sincronizar y aviso al instante)
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco para el emulador
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Servidor sin interfaz
        run: cargo build -p cyberia-server --locked

      - uses: actions/download-artifact@v4
        with:
          name: cyberia-android
          path: apk

      - name: Prueba en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          cores: 4
          ram-size: 3072M
          disk-size: 3G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-metrics
          script: bash .github/scripts/android-e2e.sh apk/cyberia.apk target/debug/cyberia-server

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: e2e-out
          if-no-files-found: warn
